<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hold'em Odds</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><span class="pip">&#9824;</span> Hold&rsquo;em Odds</div>
      <div class="controls">
        <div class="ctrl players-ctrl">
          <span>Players</span>
          <button id="dec" title="Remove player">&minus;</button>
          <span id="pcount">2</span>
          <button id="inc" title="Add player">+</button>
        </div>
        <label class="ctrl trials-ctrl">
          <span>MC trials</span>
          <input id="trials" type="number" value="100000" min="1000" step="10000">
        </label>
        <button id="newhand" class="btn">New Hand</button>
        <button id="quizbtn" class="btn quiz-btn">Quiz</button>
      </div>
    </header>

    <div id="status" class="status">Add two cards to every player to see the odds.</div>

    <main class="stage" id="stage">
      <div class="felt"></div>
      <div class="board-wrap">
        <div class="board" id="board"></div>
        <div class="street" id="street">preflop</div>
      </div>
      <div class="seats" id="seats"></div>
    </main>

    <footer id="compare" class="compare hidden"></footer>
  </div>

  <div id="picker" class="picker hidden"></div>
  <div id="hover" class="hover hidden"></div>

  <div id="quiz" class="quiz-overlay hidden">
    <div class="quiz-panel">
      <div class="quiz-header">
        <div class="quiz-tabs">
          <button class="quiz-tab active" data-mode="ahead">Who's Ahead?</button>
          <button class="quiz-tab" data-mode="potodds">Should You Call?</button>
        </div>
        <div class="quiz-info">
          <span class="quiz-score-label">Score: <b id="qscore">0 / 0</b></span>
          <button id="qclose" class="quiz-close-btn">&times;</button>
        </div>
      </div>
      <div id="qbody" class="quiz-body"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
